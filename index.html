<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Treintellingen</title>

<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
    color: #17212b;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
}

h1 {
    margin-top: 0;
    text-align: center;
}

.form-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

input,
select,
button {
    padding: 10px;
    font-size: 16px;
}

input[type="time"],
select {
    flex: 1;
}

button {
    background: #0078d7;
    color: #ffffff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #0068bc;
}

.day-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
}

.end-day-btn {
    background: #b3261e;
}

.end-day-btn:hover {
    background: #8f1f19;
}

.install-btn {
    background: #5b3fa3;
}

.install-btn:hover {
    background: #493282;
}

.install-btn[hidden] {
    display: none;
}

.delete-btn {
    background: #d9534f;
}

.delete-btn:hover {
    background: #c53f3b;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    border: 1px solid #d7dce1;
    padding: 10px;
    text-align: center;
}

th {
    background: #0078d7;
    color: #ffffff;
}

.persons-input {
    width: 90px;
    text-align: center;
}

.stats-box {
    margin-top: 20px;
    padding: 15px;
    background: #eef6ff;
    border-radius: 5px;
    font-weight: bold;
    line-height: 2;
}

.train-groups {
    display: flex;
    flex-direction: column;
    gap: 30px;
}

.train-group-wrapper {
    border: 1px solid #d7dce1;
    border-radius: 10px;
    overflow: hidden;
    background: #ffffff;
}

.group-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 12px 15px;
    background: #f2f6f9;
    border-bottom: 1px solid #d7dce1;
}

.group-title {
    margin: 0;
    font-size: 18px;
}

.download-btn {
    background: #18864b;
}

.download-btn:hover {
    background: #126e3d;
}

.chart-btn {
    background: #0b7285;
}

.chart-btn:hover {
    background: #075f6f;
}

.day-actions {
    gap: 10px;
    flex-wrap: wrap;
}

.chart-export-card {
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 28px;
    padding: 42px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

.chart-export-header {
    text-align: center;
    margin-bottom: 18px;
}

.chart-export-header h2 {
    margin: 0;
    color: #0078d7;
    font-size: 38px;
}

.chart-export-header p {
    margin: 10px 0 0;
    color: #66717d;
    font-size: 20px;
}

.chart-wrapper {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.day-chart {

.chart-summary {

.chart-summary-item {

.group-table-wrapper {

.export-area {

    top: 0;

    height: 1200px;
    background: #eef3f7;

}

.export-card {
    width: 100%;
    height: 100%;
    background: #ffffff;

}

.export-header {

}

.export-header h2 {

.export-header p {

.export-table {

.export-stats {

    padding: 28px;

.export-footer {

    margin-top: 25px;

@media (max-width: 650px) {

        padding: 10px;

    .form-row {

    button {
        width: 100%;
    }

    .group-toolbar {
        flex-direction: column;

<div class="container">

    <h1>Treintellingen Station Zandvoort</h1>

    <div class="form-row">
        <input
            type="time"
            id="trainTime"
            aria-label="Treintijd"
        >

        <select
            id="trainDirection"
            aria-label="Richting"
        >
            <option value="Amsterdam">Amsterdam</option>
            <option value="Haarlem">Haarlem</option>
        </select>

        <button type="button" onclick="addTrain()">
            Trein toevoegen
        </button>
    </div>

    <div id="trainGroups" class="train-groups">
        <div class="empty-message">
            Er zijn nog geen treinen toegevoegd.
        </div>
    </div>

    <div class="stats-box">
        <div>
            Totaal aantal personen:
            <span id="totalPersons">0</span>
        </div>

        <div>
            Ingevulde treinen:
            <span id="filledTrains">0</span>
        </div>

        <div>
            Gemiddeld aantal personen:
            <span id="averagePersons">0</span>
        </div>
    </div>

    <div class="day-actions">
        <button id="installButton" type="button" class="install-btn" hidden>
            App installeren
        </button>

        <button type="button" class="chart-btn" onclick="downloadDayChart()">
            Download daggrafiek
        </button>

        <button type="button" class="end-day-btn" onclick="endDay()">
            Einde dag
        </button>
    </div>

</div>

<div id="exportArea" class="export-area"></div>

<script>
const trainGroupsElement = document.getElementById("trainGroups");
const exportArea = document.getElementById("exportArea");

let trains = [];
let nextTrainId = 1;

const STORAGE_KEY = "treintellingen-zandvoort";

function saveData() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
            trains,
            nextTrainId
        })
    );
}

function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) {
        return;
    }

    try {
        const data = JSON.parse(raw);

        trains = Array.isArray(data.trains)
            ? data.trains
            : [];

        nextTrainId = Number.isInteger(data.nextTrainId)
            ? data.nextTrainId
            : trains.reduce(
                (maximum, train) =>
                    Math.max(maximum, train.id || 0),
                0
            ) + 1;

        sortTrains();
    } catch (error) {
        console.error("Opgeslagen gegevens laden mislukt:", error);
    }
}

function endDay() {
    if (!confirm(
        "Weet je zeker dat je de dag wilt afsluiten? " +
        "Alle treinen en tellingen op dit apparaat worden gewist."
    )) {
        return;
    }

    localStorage.removeItem(STORAGE_KEY);
    trains = [];
    nextTrainId = 1;

    renderTrainGroups();
    updateStatistics();
}

function addTrain() {
    const timeInput = document.getElementById("trainTime");
    const directionInput = document.getElementById
function createTrainRow(train) {
    return `
        <tr>
            <td>${escapeHtml(train.time)}</td>

            <td>${escapeHtml(train.direction)}</td>

            <td>
                <input
                    type="number"
                    min="0"
                    step="1"
                    class="persons-input"
                    value="${escapeHtml(train.persons)}"
                    placeholder="-"
                    aria-label="Aantal personen bij trein ${escapeHtml(train.time)}"
                    oninput="updateTrainPersons(${train.id}, this.value)"
                >
            </td>

            <td>
                <button
                    type="button"
                    class="delete-btn"
                    onclick="deleteTrain(${train.id})"
                >
                    Verwijder
                </button>
            </td>
        </tr>
    `;
}

function splitIntoGroups(items, groupSize) {
    const groups = [];

    for (
        let index = 0;
        index < items.length;
        index += groupSize
    ) {
        groups.push(
            items.slice(index, index + groupSize)
        );
    }

    return groups;
}

function calculateStatistics(trainList) {
    const filledTrainData = trainList
        .filter(train => train.persons !== "")
        .map(train => ({
            ...train,
            numericPersons:
                Number.parseInt(train.persons, 10) || 0
        }));

    const total = filledTrainData.reduce(
        (sum, train) =>
            sum + train.numericPersons,
        0
    );

    const filled = filledTrainData.length;

    const average = filled > 0
        ? (total / filled).toFixed(1)
        : "0";

    const highest = filled > 0
        ? Math.max(
            ...filledTrainData.map(
                train => train.numericPersons
            )
        )
        : 0;

    const lowest = filled > 0
        ? Math.min(
            ...filledTrainData.map(
                train => train.numericPersons
            )
        )
        : 0;

    const busiestTrain = filled > 0
        ? filledTrainData.reduce(
            (currentBusiest, train) => {
                if (
                    train.numericPersons >
                    currentBusiest.numericPersons
                ) {
                    return train;
                }

                return currentBusiest;
            }
        )
        : null;

    return {
        total,
        filled,
        average,
        highest,
        lowest,
        busiestTrain
    };
}

function updateStatistics() {
    const statistics = calculateStatistics(trains);

    document
        .getElementById("totalPersons")
        .textContent = statistics.total;

    document
        .getElementById("filledTrains")
        .textContent = statistics.filled;

    document
        .getElementById("averagePersons")
        .textContent = statistics.average;
}

function createExportRows(group) {
    const rows = [...group];

    while (rows.length < 6) {
        rows.push(null);
    }

    return rows.map(train => {
        if (!train) {
            return `
                <tr>
                    <td>—</td>
                    <td>—</td>
                    <td>—</td>
                </tr>
            `;
        }

        const persons = train.persons === ""
            ? "Niet ingevuld"
            : train.persons;

        return `
            <tr>
                <td>${escapeHtml(train.time)}</td>
                <td>${escapeHtml(train.direction)}</td>
                <td>${escapeHtml(persons)}</td>
            </tr>
        `;
    }).join("");
}

async function downloadGroup(groupIndex) {
    const groups = splitIntoGroups(trains, 6);
    const group = groups[groupIndex];

    if (!group || group.length === 0) {
        return;
    }

    const dayStatistics =
        calculateStatistics(trains);

    const startNumber =
        groupIndex * 6 + 1;

    const endNumber =
        startNumber + group.length - 1;

    exportArea.innerHTML = `
        <div class="export-card">
            <div class="export-header">
                <h2>
                    Treintellingen Station Zandvoort
                </h2>

                <p>
                    Blok ${groupIndex + 1}
                    · Treinen ${startNumber}
                    t/m ${endNumber}
                </p>
            </div>

            <table class="export-table">
                <thead>
                    <tr>
                        <th>Treintijd</th>
                        <th>Vanaf</th>
                        <th>Aantal personen</th>
                    </tr>
                </thead>

                <tbody>
                    ${createExportRows(group)}
                </tbody>
            </table>

            <div class="export-stats">
                <div class="export-stat-row">
                    <span>Totaal hele dag</span>
                    <span>
                        ${dayStatistics.total}
                    </span>
                </div>

                <div class="export-stat-row">
                    <span>
                        Ingevulde treinen hele dag
                    </span>

                    <span>
                        ${dayStatistics.filled}
                        van ${trains.length}
                    </span>
                </div>

                <div class="export-stat-row">
                    <span>
                        Gemiddelde hele dag
                    </span>

                    <span>
                        ${dayStatistics.average}
                    </span>
                </div>
            </div>

            <div class="export-footer">
                Dagstatistieken Station Zandvoort
            </div>
        </div>
    `;

    await downloadExportArea(
        `treintellingen-blok-${groupIndex + 1}.png`
    );
}

function getFilledTrains() {
    return trains
        .filter(train => train.persons !== "")
        .map(train => ({
            ...train,
            numericPersons:
                Number.parseInt(train.persons, 10) || 0
        }));
}

function createDayChartSvg(filledTrains) {
    const width = 810;
    const height = 610;

    const margin = {
        top: 70,
        right: 45,
        bottom: 100,
        left: 75
    };

    const chartWidth =
        width - margin.left - margin.right;

    const chartHeight =
        height - margin.top - margin.bottom;

    const values = filledTrains.map(
        train => train.numericPersons
    );

    const maximumValue = Math.max(...values, 1);

    const roundedMaximum = Math.max(
        10,
        Math.ceil(maximumValue / 10) * 10
    );

    const statistics =
        calculateStatistics(filledTrains);

    const pointSpacing = filledTrains.length > 1
        ? chartWidth / (filledTrains.length - 1)
        : 0;

    const getX = index => {
        if (filledTrains.length === 1) {
            return margin.left + chartWidth / 2;
        }

        return margin.left + index * pointSpacing;
    };

    const getY = value => {
        return (
            margin.top +
            chartHeight -
            (value / roundedMaximum) *
            chartHeight
        );
    };

    const horizontalGridLines = [];
    const yAxisLabels = [];

    const numberOfSteps = 5;

    for (
        let step = 0;
        step <= numberOfSteps;
        step++
    ) {
        const value =
            roundedMaximum *
            (step / numberOfSteps);

        const y = getY(value);

        horizontalGridLines.push(`
            <line
                x1="${margin.left}"
                y1="${y}"
                x2="${margin.left + chartWidth}"
                y2="${y}"
                stroke="#dfe5ea"
                stroke-width="1"
            />
        `);

        yAxisLabels.push(`
            <text
                x="${margin.left - 15}"
                y="${y + 6}"
                text-anchor="end"
                font-size="17"
                fill="#56616c"
            >
                ${Math.round(value)}
            </text>
        `);
    }

    const linePoints = filledTrains
        .map((train, index) => {
            return `${getX(index)},${getY(
                train.numericPersons
            )}`;
        })
        .join(" ");

    const averageY =
        getY(Number(statistics.average));

    const busiestTrain =
        statistics.busiestTrain;

    const busiestIndex =
        filledTrains.findIndex(
            train => train.id === busiestTrain.id
        );

    const points = filledTrains.map(
        (train, index) => {
            const isBusiest =
                index === busiestIndex;

            const circleRadius =
                isBusiest ? 10 : 7;

            const circleFill =
                isBusiest
                    ? "#b3261e"
                    : "#0078d7";

            return `
                <circle
                    cx="${getX(index)}"
                    cy="${getY(
                        train.numericPersons
                    )}"
                    r="${circleRadius}"
                    fill="${circleFill}"
                    stroke="#ffffff"
                    stroke-width="3"
                />

                <text
                    x="${getX(index)}"
                    y="${
                        getY(
                            train.numericPersons
                        ) - 16
                    }"
                    text-anchor="middle"
                    font-size="16"
                    font-weight="bold"
                    fill="#17212b"
                >
                    ${train.numericPersons}
                </text>
            `;
        }
    ).join("");

    const xAxisLabels = filledTrains.map(
        (train, index) => {
            const x = getX(index);
            const y =
                margin.top +
                chartHeight +
                28;

            return `
                <g
                    transform="
                        translate(${x}, ${y})
                        rotate(-45)
                    "
                >
                    <text
                        text-anchor="end"
                        font-size="15"
                        fill="#56616c"
                    >
                        ${escapeSvg(train.time)}
                    </text>

                    <text
                        y="18"
                        text-anchor="end"
                        font-size="12"
                        fill="#7b858f"
                    >
                        ${escapeSvg(
                            train.direction
                        )}
                    </text>
                </g>
            `;
        }
    ).join("");

    return `
        <svg
            class="day-chart"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 ${width} ${height}"
            role="img"
            aria-label="Daggrafiek treintellingen"
        >
            <rect
                width="${width}"
                height="${height}"
                fill="#ffffff"
            />

            <text
                x="${width / 2}"
                y="34"
                text-anchor="middle"
                font-size="20"
                font-weight="bold"
                fill="#17212b"
            >
                Aantal personen per trein
            </text>

            ${horizontalGridLines.join("")}
            ${yAxisLabels.join("")}

            <line
                x1="${margin.left}"
                y1="${margin.top}"
                x2="${margin.left}"
                y2="${margin.top + chartHeight}"
                stroke="#74808b"
                stroke-width="2"
            />

            <line
                x1="${margin.left}"
                y1="${margin.top + chartHeight}"
                x2="${margin.left + chartWidth}"
                y2="${margin.top + chartHeight}"
                stroke="#74808b"
                stroke-width="2"
            />

            <line
                x1="${margin.left}"
                y1="${averageY}"
                x2="${margin.left + chartWidth}"
                y2="${averageY}"
                stroke="#18864b"
                stroke-width="3"
                stroke-dasharray="12 8"
            />

            <text
                x="${margin.left + chartWidth - 5}"
                y="${averageY - 10}"
                text-anchor="end"
                font-size="15"
                font-weight="bold"
                fill="#18864b"
            >
                Gemiddelde:
                ${statistics.average}
            </text>

            ${
                filledTrains.length > 1
                    ? `
                        <polyline
                            points="${linePoints}"
                            fill="none"
                            stroke="#0078d7"
                            stroke-width="5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    `
                    : ""
            }

            ${points}
            ${xAxisLabels}

            <text
                x="24"
                y="${margin.top + chartHeight / 2}"
                transform="
                    rotate(
                        -90,
                        24,
                        ${margin.top + chartHeight / 2}
                    )
                "
                text-anchor="middle"
                font-size="17"
                font-weight="bold"
                fill="#56616c"
            >
                Aantal personen
            </text>

            <circle
                cx="${margin.left}"
                cy="${height - 25}"
                r="7"
                fill="#0078d7"
            />

            <text
                x="${margin.left + 16}"
                y="${height - 19}"
                font-size="14"
                fill="#56616c"
            >
                Treintelling
            </text>

            <circle
                cx="${margin.left + 150}"
                cy="${height - 25}"
                r="8"
                fill="#b3261e"
            />

            <text
                x="${margin.left + 168}"
                y="${height - 19}"
                font-size="14"
                fill="#56616c"
            >
                Drukste trein
            </text>

            <line
                x1="${margin.left + 300}"
                y1="${height - 25}"
                x2="${margin.left + 355}"
                y2="${height - 25}"
                stroke="#18864b"
                stroke-width="3"
                stroke-dasharray="10 7"
            />

            <text
                x="${margin.left + 365}"
                y="${height - 19}"
                font-size="14"
                fill="#56616c"
            >
                Gemiddelde
            </text>
        </svg>
    `;
}

async function downloadDayChart() {
    const filledTrains = getFilledTrains();

    if (filledTrains.length === 0) {
        alert(
            "Vul eerst bij minimaal één trein " +
            "het aantal personen in."
        );

        return;
    }

    const statistics =
        calculateStatistics(filledTrains);

    const busiestTrain =
        statistics.busiestTrain;

    exportArea.innerHTML = `
        <div class="chart-export-card">
            <div class="chart-export-header">
                <h2>
                    Daggrafiek Station Zandvoort
                </h2>

                <p>
                    Personen per trein
                    · ${getCurrentDateText()}
                </p>
            </div>

            <div class="chart-wrapper">
                ${createDayChartSvg(
                    filledTrains
                )}
            </div>

            <div class="chart-summary">
                <div class="chart-summary-item">
                    <span>Totaal</span>
                    <strong>
                        ${statistics.total}
                    </strong>
                </div>

                <div class="chart-summary-item">
                    <span>Gemiddelde</span>
                    <strong>
                        ${statistics.average}
                    </strong>
                </div>

                <div class="chart-summary-item">
                    <span>Hoogste telling</span>
                    <strong>
                        ${statistics.highest}
                    </strong>
                </div>

                <div class="chart-summary-item">
                    <span>Laagste telling</span>
                    <strong>
                        ${statistics.lowest}
                    </strong>
                </div>

                <div class="chart-summary-item">
                    <span>Ingevulde treinen</span>
                    <strong>
                        ${statistics.filled}
                        van ${trains.length}
                    </strong>
                </div>

                <div class="chart-summary-item">
                    <span>Drukste trein</span>
                    <strong>
                        ${escapeHtml(
                            busiestTrain.time
                        )}
                        ·
                        ${escapeHtml(
                            busiestTrain.direction
                        )}
                    </strong>
                </div>
            </div>

            <div class="export-footer">
                Treintellingen Station Zandvoort
            </div>
        </div>
    `;

    await downloadExportArea(
        `treintellingen-daggrafiek-${getFileDate()}.png`
    );
}

async function downloadExportArea(fileName) {
    try {
        const canvas = await html2canvas(
            exportArea,
            {
                width: 900,
                height: 1200,
                scale: 1,
                backgroundColor: "#eef3f7",
                useCORS: true,
                logging: false
            }
        );

        const downloadLink =
            document.createElement("a");

        downloadLink.download = fileName;
        downloadLink.href =
            canvas.toDataURL("image/png");

        document.body.appendChild(
            downloadLink
        );

        downloadLink.click();
        downloadLink.remove();
    } catch (error) {
        console.error(
            "Afbeelding maken mislukt:",
            error
        );

        alert(
            "Het maken van de afbeelding is mislukt. " +
            "Controleer of html2canvas geladen is."
        );
    } finally {
        exportArea.innerHTML = "";
    }
}

function getCurrentDateText() {
    return new Intl.DateTimeFormat(
        "nl-NL",
        {
            day: "2-digit",
            month: "long",
            year: "numeric"
        }
    ).format(new Date());
}

function getFileDate() {
    const date = new Date();

    const year =
        date.getFullYear();

    const month = String(
        date.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        date.getDate()
    ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function escapeSvg(value) {
    return escapeHtml(value);
}

document
    .getElementById("trainTime")
    .addEventListener(
        "keydown",
        event => {
            if (event.key === "Enter") {
                addTrain();
            }
        }
    );

let deferredInstallPrompt = null;

const installButton =
    document.getElementById(
        "installButton"
    );

window.addEventListener(
    "beforeinstallprompt",
    event => {
        event.preventDefault();

        deferredInstallPrompt = event;
        installButton.hidden = false;
    }
);

installButton.addEventListener(
    "click",
    async () => {
        if (!deferredInstallPrompt) {
            return;
        }

        deferredInstallPrompt.prompt();

        await deferredInstallPrompt
            .userChoice;

        deferredInstallPrompt = null;
        installButton.hidden = true;
    }
);

window.addEventListener(
    "appinstalled",
    () => {
        deferredInstallPrompt = null;
        installButton.hidden = true;
    }
);

if ("serviceWorker" in navigator) {
    window.addEventListener(
        "load",
        () => {
            navigator.serviceWorker
                .register(
                    "./service-worker.js"
                )
                .catch(error => {
                    console.error(
                        "Service worker registreren mislukt:",
                        error
                    );
                });
        }
    );
}

loadData();
renderTrainGroups();
updateStatistics();
</script>
