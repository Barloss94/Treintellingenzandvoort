<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Treintellingen</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0078d7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Treintellingen">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
    color: #17212b;
}

.container {
    width: 100%;
    max-width: 1250px;
    margin: auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
}

h1 {
    margin-top: 0;
    text-align: center;
}

.form-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

input,
select,
button {
    padding: 10px;
    font-size: 16px;
}

input[type="time"],
select {
    flex: 1;
}

button {
    background: #0078d7;
    color: #ffffff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #0068bc;
}

button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

.day-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
}

.end-day-btn {
    background: #b3261e;
}

.end-day-btn:hover {
    background: #8f1f19;
}

.install-btn {
    background: #5b3fa3;
}

.install-btn:hover {
    background: #493282;
}

.install-btn[hidden] {
    display: none;
}

.delete-btn {
    background: #d9534f;
}

.delete-btn:hover {
    background: #c53f3b;
}

.cancel-btn {
    background: #e58a00;
}

.cancel-btn:hover {
    background: #c87800;
}

.restore-btn {
    background: #18864b;
}

.restore-btn:hover {
    background: #126e3d;
}

.action-buttons {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    border: 1px solid #d7dce1;
    padding: 10px;
    text-align: center;
}

th {
    background: #0078d7;
    color: #ffffff;
}

.persons-input,
.delay-input {
    width: 90px;
    text-align: center;
}

.delay-cell {
    white-space: nowrap;
}

.new-arrival {
    font-weight: bold;
}

.new-arrival.delayed {
    color: #b3261e;
}

.cancelled-row {
    background: #fff0f0 !important;
    color: #8f1f19;
}

.cancelled-row td {
    opacity: 0.88;
}

.cancelled-status {
    display: inline-block;
    background: #b3261e;
    color: #ffffff;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: bold;
}

.stats-box {
    margin-top: 20px;
    padding: 15px;
    background: #eef6ff;
    border-radius: 5px;
    font-weight: bold;
    line-height: 2;
}

.train-groups {
    display: flex;
    flex-direction: column;
    gap: 30px;
}

.train-group-wrapper {
    border: 1px solid #d7dce1;
    border-radius: 10px;
    overflow: hidden;
    background: #ffffff;
}

.group-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 12px 15px;
    background: #f2f6f9;
    border-bottom: 1px solid #d7dce1;
}

.group-title {
    margin: 0;
    font-size: 18px;
}

.download-btn {
    background: #18864b;
}

.download-btn:hover {
    background: #126e3d;
}

.group-table-wrapper {
    overflow-x: auto;
}

.export-area {
    position: fixed;
    left: -10000px;
    top: 0;
    width: 900px;
    height: 1200px;
    background: #eef3f7;
    padding: 45px;
    overflow: hidden;
    z-index: -1;
}

.export-card {
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 28px;
    padding: 45px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

.export-header {
    text-align: center;
    margin-bottom: 38px;
}

.export-header h2 {
    margin: 0;
    color: #0078d7;
    font-size: 40px;
}

.export-header p {
    margin: 12px 0 0;
    color: #66717d;
    font-size: 22px;
}

.export-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

.export-table th {
    background: #0078d7;
    color: #ffffff;
    padding: 16px 6px;
    font-size: 16px;
}

.export-table td {
    height: 88px;
    padding: 12px 6px;
    font-size: 18px;
    border: 2px solid #dce2e7;
}

.export-table tbody tr:nth-child(even) {
    background: #f5f9fc;
}

.export-cancelled-row {
    background: #fff0f0 !important;
    color: #b3261e;
    font-weight: bold;
}

.export-stats {
    margin-top: auto;
    padding: 28px;
    border-radius: 18px;
    background: #eef6ff;
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
}

.export-stat-row {
    display: flex;
    justify-content: space-between;
    gap: 30px;
    font-size: 24px;
}

.export-stat-row span:first-child {
    font-weight: bold;
}

.export-footer {
    text-align: center;
    margin-top: 25px;
    color: #7b858f;
    font-size: 18px;
}

.empty-message {
    padding: 30px;
    text-align: center;
    color: #65717c;
}

.chart-btn {
    background: #6f42c1;
}

.chart-btn:hover {
    background: #59359c;
}

.chart-export-card {
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 28px;
    padding: 42px;
    display: flex;
    flex-direction: column;
}

.chart-export-title {
    text-align: center;
    margin-bottom: 24px;
}

.chart-export-title h2 {
    margin: 0;
    color: #0078d7;
    font-size: 38px;
}

.chart-export-title p {
    margin: 10px 0 0;
    color: #66717d;
    font-size: 20px;
}

.chart-summary {
    margin-top: 24px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.chart-summary-item {
    background: #eef6ff;
    border-radius: 14px;
    padding: 16px;
    font-size: 20px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
}

@media (max-width: 650px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 15px;
    }

    .form-row {
        flex-direction: column;
    }

    input,
    select,
    button {
        width: 100%;
    }

    .group-toolbar {
        flex-direction: column;
        align-items: stretch;
    }

    .group-title {
        text-align: center;
    }

    .persons-input,
    .delay-input {
        width: 70px;
    }

    .action-buttons {
        min-width: 110px;
    }

    .action-buttons button {
        width: auto;
    }

    th,
    td {
        padding: 8px 5px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Treintellingen Station Zandvoort</h1>

    <div class="form-row">
        <input
            type="time"
            id="trainTime"
            aria-label="Treintijd"
        >

        <select
            id="trainDirection"
            aria-label="Richting"
        >
            <option value="Amsterdam">Amsterdam</option>
            <option value="Haarlem">Haarlem</option>
        </select>

        <button type="button" onclick="addTrain()">
            Trein toevoegen
        </button>
    </div>

    <div id="trainGroups" class="train-groups">
        <div class="empty-message">
            Er zijn nog geen treinen toegevoegd.
        </div>
    </div>

    <div class="stats-box">
        <div>
            Totaal aantal personen:
            <span id="totalPersons">0</span>
        </div>

        <div>
            Ingevulde treinen:
            <span id="filledTrains">0</span>
        </div>

        <div>
            Geannuleerde treinen:
            <span id="cancelledTrains">0</span>
        </div>

        <div>
            Gemiddeld aantal personen:
            <span id="averagePersons">0</span>
        </div>
    </div>

    <div class="day-actions">
        <button type="button" class="chart-btn" onclick="downloadDayChart()">
            Download daggrafiek
        </button>

        <button id="installButton" type="button" class="install-btn" hidden>
            App installeren
        </button>

        <button type="button" class="end-day-btn" onclick="endDay()">
            Einde dag
        </button>
    </div>

</div>

<div id="exportArea" class="export-area"></div>

<script>
const trainGroupsElement = document.getElementById("trainGroups");
const exportArea = document.getElementById("exportArea");

let trains = [];
let nextTrainId = 1;

const STORAGE_KEY = "treintellingen-zandvoort";

function saveData() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
            trains,
            nextTrainId
        })
    );
}

function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) {
        return;
    }

    try {
        const data = JSON.parse(raw);

        trains = Array.isArray(data.trains)
            ? data.trains.map(train => ({
                ...train,
                delay: train.delay ?? "",
                cancelled: train.cancelled ?? false
            }))
            : [];

        nextTrainId = Number.isInteger(data.nextTrainId)
            ? data.nextTrainId
            : (
                trains.reduce(
                    (maxId, train) => Math.max(maxId, train.id || 0),
                    0
                ) + 1
            );

        sortTrains();

    } catch (error) {
        console.error("Opgeslagen gegevens laden mislukt:", error);
    }
}

function endDay() {
    if (!confirm(
        "Weet je zeker dat je de dag wilt afsluiten? " +
        "Alle treinen en tellingen op dit apparaat worden gewist."
    )) {
        return;
    }

    localStorage.removeItem(STORAGE_KEY);

    trains = [];
    nextTrainId = 1;

    renderTrainGroups();
    updateStatistics();
}

function addTrain() {
    const timeInput = document.getElementById("trainTime");
    const directionInput = document.getElementById("trainDirection");

    const time = timeInput.value;
    const direction = directionInput.value;

    if (!time) {
        alert("Vul eerst een treintijd in.");
        return;
    }

    trains.push({
        id: nextTrainId++,
        time,
        direction,
        delay: "",
        persons: "",
        cancelled: false
    });

    sortTrains();
    renderTrainGroups();
    updateStatistics();
    saveData();

    timeInput.value = "";
    timeInput.focus();
}

function sortTrains() {
    trains.sort((trainA, trainB) => {
        return trainA.time.localeCompare(trainB.time);
    });
}

function deleteTrain(trainId) {
    trains = trains.filter(train => train.id !== trainId);

    renderTrainGroups();
    updateStatistics();
    saveData();
}

function toggleTrainCancelled(trainId) {
    const train = trains.find(item => item.id === trainId);

    if (!train) {
        return;
    }

    train.cancelled = !train.cancelled;

    /*
        Bij annuleren laten we een eventuele eerder
        ingevoerde telling staan in de data, maar deze
        telt niet meer mee in de statistieken.

        Als de annulering ongedaan wordt gemaakt,
        staat de eerder ingevoerde telling dus weer klaar.
    */

    renderTrainGroups();
    updateStatistics();
    saveData();
}

function updateTrainPersons(trainId, value) {
    const train = trains.find(item => item.id === trainId);

    if (!train || train.cancelled) {
        return;
    }

    train.persons = value;

    updateStatistics();
    saveData();
}

function updateTrainDelay(trainId, value) {
    const train = trains.find(item => item.id === trainId);

    if (!train || train.cancelled) {
        return;
    }

    train.delay = value;

    renderTrainGroups();
    saveData();
}

function calculateArrivalTime(time, delay) {
    if (!time) {
        return "";
    }

    const delayMinutes = Number.parseInt(delay, 10) || 0;

    const [hours, minutes] = time
        .split(":")
        .map(Number);

    const totalMinutes =
        (hours * 60) +
        minutes +
        delayMinutes;

    const normalizedMinutes =
        ((totalMinutes % 1440) + 1440) % 1440;

    const newHours =
        Math.floor(normalizedMinutes / 60);

    const newMinutes =
        normalizedMinutes % 60;

    return (
        String(newHours).padStart(2, "0") +
        ":" +
        String(newMinutes).padStart(2, "0")
    );
}

function renderTrainGroups() {
    trainGroupsElement.innerHTML = "";

    if (trains.length === 0) {
        trainGroupsElement.innerHTML = `
            <div class="empty-message">
                Er zijn nog geen treinen toegevoegd.
            </div>
        `;

        return;
    }

    const groups = splitIntoGroups(trains, 6);

    groups.forEach((group, groupIndex) => {
        const wrapper = document.createElement("section");

        wrapper.className = "train-group-wrapper";

        const startNumber = groupIndex * 6 + 1;
        const endNumber = startNumber + group.length - 1;

        wrapper.innerHTML = `
            <div class="group-toolbar">
                <h2 class="group-title">
                    Blok ${groupIndex + 1}
                    · Treinen ${startNumber} t/m ${endNumber}
                </h2>

                <button
                    type="button"
                    class="download-btn"
                    onclick="downloadGroup(${groupIndex})"
                >
                    Download blok als afbeelding
                </button>
            </div>

            <div class="group-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Treintijd</th>
                            <th>Vanaf</th>
                            <th>Vertraging</th>
                            <th>Aankomst</th>
                            <th>Aantal personen</th>
                            <th>Status / actie</th>
                        </tr>
                    </thead>

                    <tbody>
                        ${group.map(train => createTrainRow(train)).join("")}
                    </tbody>
                </table>
            </div>
        `;

        trainGroupsElement.appendChild(wrapper);
    });
}

function createTrainRow(train) {
    const delay = train.delay ?? "";
    const delayNumber = Number.parseInt(delay, 10) || 0;

    const newArrivalTime =
        calculateArrivalTime(
            train.time,
            delay
        );

    if (train.cancelled) {
        return `
            <tr class="cancelled-row">
                <td>
                    ${escapeHtml(train.time)}
                </td>

                <td>
                    ${escapeHtml(train.direction)}
                </td>

                <td>
                    —
                </td>

                <td>
                    —
                </td>

                <td>
                    —
                </td>

                <td>
                    <div class="action-buttons">
                        <span class="cancelled-status">
                            Geannuleerd
                        </span>

                        <button
                            type="button"
                            class="restore-btn"
                            onclick="toggleTrainCancelled(${train.id})"
                        >
                            Herstel
                        </button>

                        <button
                            type="button"
                            class="delete-btn"
                            onclick="deleteTrain(${train.id})"
                        >
                            Verwijder
                        </button>
                    </div>
                </td>
            </tr>
        `;
    }

    const delayedClass =
        delayNumber > 0
            ? "delayed"
            : "";

    return `
        <tr>
            <td>
                ${escapeHtml(train.time)}
            </td>

            <td>
                ${escapeHtml(train.direction)}
            </td>

            <td class="delay-cell">
                <input
                    type="number"
                    min="0"
                    step="1"
                    class="delay-input"
                    value="${escapeHtml(delay)}"
                    placeholder="0"
                    aria-label="Vertraging in minuten bij trein ${escapeHtml(train.time)}"
                    oninput="updateTrainDelay(${train.id}, this.value)"
                >
                min
            </td>

            <td>
                <span class="new-arrival ${delayedClass}">
                    ${escapeHtml(newArrivalTime)}
                </span>
            </td>

            <td>
                <input
                    type="number"
                    min="0"
                    step="1"
                    class="persons-input"
                    value="${escapeHtml(train.persons)}"
                    placeholder="-"
                    aria-label="Aantal personen bij trein ${escapeHtml(train.time)}"
                    oninput="updateTrainPersons(${train.id}, this.value)"
                >
            </td>

            <td>
                <div class="action-buttons">
                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="toggleTrainCancelled(${train.id})"
                    >
                        Annuleer
                    </button>

                    <button
                        type="button"
                        class="delete-btn"
                        onclick="deleteTrain(${train.id})"
                    >
                        Verwijder
                    </button>
                </div>
            </td>
        </tr>
    `;
}

function splitIntoGroups(items, groupSize) {
    const groups = [];

    for (
        let index = 0;
        index < items.length;
        index += groupSize
    ) {
        groups.push(
            items.slice(
                index,
                index + groupSize
            )
        );
    }

    return groups;
}

function calculateStatistics(trainList) {
    let total = 0;
    let filled = 0;
    let cancelled = 0;

    trainList.forEach(train => {
        if (train.cancelled) {
            cancelled++;
            return;
        }

        if (train.persons !== "") {
            total +=
                Number.parseInt(
                    train.persons,
                    10
                ) || 0;

            filled++;
        }
    });

    const average =
        filled > 0
            ? (total / filled).toFixed(1)
            : "0";

    return {
        total,
        filled,
        cancelled,
        average
    };
}

function updateStatistics() {
    const statistics =
        calculateStatistics(trains);

    document
        .getElementById("totalPersons")
        .textContent =
            statistics.total;

    document
        .getElementById("filledTrains")
        .textContent =
            statistics.filled;

    document
        .getElementById("cancelledTrains")
        .textContent =
            statistics.cancelled;

    document
        .getElementById("averagePersons")
        .textContent =
            statistics.average;
}

function createExportRows(group) {
    const rows = [...group];

    while (rows.length < 6) {
        rows.push(null);
    }

    return rows.map(train => {
        if (!train) {
            return `
                <tr>
                    <td>—</td>
                    <td>—</td>
                    <td>—</td>
                    <td>—</td>
                    <td>—</td>
                    <td>—</td>
                </tr>
            `;
        }

        if (train.cancelled) {
            return `
                <tr class="export-cancelled-row">
                    <td>
                        ${escapeHtml(train.time)}
                    </td>

                    <td>
                        ${escapeHtml(train.direction)}
                    </td>

                    <td>
                        —
                    </td>

                    <td>
                        —
                    </td>

                    <td>
                        —
                    </td>

                    <td>
                        GEANNULEERD
                    </td>
                </tr>
            `;
        }

        const persons =
            train.persons === ""
                ? "Niet ingevuld"
                : train.persons;

        const delay =
            train.delay ?? "";

        const delayNumber =
            Number.parseInt(
                delay,
                10
            ) || 0;

        const delayText =
            delayNumber > 0
                ? `+${delayNumber} min`
                : "Op tijd";

        const newArrivalTime =
            calculateArrivalTime(
                train.time,
                delay
            );

        return `
            <tr>
                <td>
                    ${escapeHtml(train.time)}
                </td>

                <td>
                    ${escapeHtml(train.direction)}
                </td>

                <td>
                    ${escapeHtml(delayText)}
                </td>

                <td>
                    ${escapeHtml(newArrivalTime)}
                </td>

                <td>
                    ${escapeHtml(persons)}
                </td>

                <td>
                    Actief
                </td>
            </tr>
        `;
    }).join("");
}

async function downloadGroup(groupIndex) {
    const groups =
        splitIntoGroups(
            trains,
            6
        );

    const group =
        groups[groupIndex];

    if (!group || group.length === 0) {
        return;
    }

    const dayStatistics =
        calculateStatistics(trains);

    const startNumber =
        groupIndex * 6 + 1;

    const endNumber =
        startNumber +
        group.length -
        1;

    exportArea.innerHTML = `
        <div class="export-card">

            <div class="export-header">
                <h2>
                    Treintellingen Station Zandvoort
                </h2>

                <p>
                    Blok ${groupIndex + 1}
                    · Treinen
                    ${startNumber}
                    t/m
                    ${endNumber}
                </p>
            </div>

            <table class="export-table">
                <thead>
                    <tr>
                        <th>Treintijd</th>
                        <th>Vanaf</th>
                        <th>Vertraging</th>
                        <th>Aankomst</th>
                        <th>Personen</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>
                    ${createExportRows(group)}
                </tbody>
            </table>

            <div class="export-stats">

                <div class="export-stat-row">
                    <span>
                        Totaal personen
                    </span>

                    <span>
                        ${dayStatistics.total}
                    </span>
                </div>

                <div class="export-stat-row">
                    <span>
                        Ingevulde treinen
                    </span>

                    <span>
                        ${dayStatistics.filled}
                    </span>
                </div>

                <div class="export-stat-row">
                    <span>
                        Geannuleerde treinen
                    </span>

                    <span>
                        ${dayStatistics.cancelled}
                    </span>
                </div>

                <div class="export-stat-row">
                    <span>
                        Gemiddelde
                    </span>

                    <span>
                        ${dayStatistics.average}
                    </span>
                </div>

            </div>

            <div class="export-footer">
                Dagstatistieken Station Zandvoort
            </div>
        </div>
    `;

    try {
        const canvas =
            await html2canvas(
                exportArea,
                {
                    width: 900,
                    height: 1200,
                    scale: 1,
                    backgroundColor: "#eef3f7",
                    useCORS: true,
                    logging: false
                }
            );

        const downloadLink =
            document.createElement("a");

        downloadLink.download =
            `treintellingen-blok-${groupIndex + 1}.png`;

        downloadLink.href =
            canvas.toDataURL("image/png");

        document.body
            .appendChild(downloadLink);

        downloadLink.click();

        downloadLink.remove();

    } catch (error) {
        console.error(
            "Afbeelding maken mislukt:",
            error
        );

        alert(
            "Het maken van de afbeelding is mislukt. " +
            "Controleer of html2canvas geladen is."
        );

    } finally {
        exportArea.innerHTML = "";
    }
}

async function downloadDayChart() {
    /*
        Geannuleerde treinen worden niet meegenomen
        in de grafiek.
    */
    const filledTrains =
        trains.filter(
            train =>
                !train.cancelled &&
                train.persons !== ""
        );

    if (filledTrains.length === 0) {
        alert(
            "Vul eerst bij minimaal één niet-geannuleerde trein " +
            "het aantal personen in."
        );

        return;
    }

    const values =
        filledTrains.map(
            train =>
                Number.parseInt(
                    train.persons,
                    10
                ) || 0
        );

    const total =
        values.reduce(
            (sum, value) =>
                sum + value,
            0
        );

    const average =
        total / values.length;

    const highest =
        Math.max(...values);

    const lowest =
        Math.min(...values);

    const busiestIndex =
        values.indexOf(highest);

    const busiestTrain =
        filledTrains[busiestIndex];

    const width = 816;
    const height = 650;

    const margin = {
        top: 55,
        right: 35,
        bottom: 95,
        left: 75
    };

    const plotWidth =
        width -
        margin.left -
        margin.right;

    const plotHeight =
        height -
        margin.top -
        margin.bottom;

    const maxValue =
        Math.max(
            10,
            Math.ceil(
                highest / 10
            ) * 10
        );

    const xStep =
        filledTrains.length > 1
            ? plotWidth /
                (
                    filledTrains.length -
                    1
                )
            : 0;

    const y =
        value =>
            margin.top +
            plotHeight -
            (
                value /
                maxValue
            ) *
            plotHeight;

    const x =
        index =>
            filledTrains.length > 1
                ? margin.left +
                    index * xStep
                : margin.left +
                    plotWidth / 2;

    const points =
        values
            .map(
                (value, index) =>
                    `${x(index)},${y(value)}`
            )
            .join(" ");

    const yTicks = 5;

    let gridLines = "";

    for (
        let tick = 0;
        tick <= yTicks;
        tick++
    ) {
        const value =
            Math.round(
                (
                    maxValue /
                    yTicks
                ) *
                tick
            );

        const yPos =
            y(value);

        gridLines += `
            <line
                x1="${margin.left}"
                y1="${yPos}"
                x2="${width - margin.right}"
                y2="${yPos}"
                stroke="#dce2e7"
                stroke-width="1"
            />

            <text
                x="${margin.left - 12}"
                y="${yPos + 6}"
                text-anchor="end"
                font-size="16"
                fill="#52606d"
            >
                ${value}
            </text>
        `;
    }

    const labels =
        filledTrains
            .map(
                (train, index) => {
                    const xPos =
                        x(index);

                    return `
                        <text
                            x="${xPos}"
                            y="${height - margin.bottom + 28}"
                            text-anchor="middle"
                            font-size="14"
                            fill="#52606d"
                            transform="rotate(-45 ${xPos} ${height - margin.bottom + 28})"
                        >
                            ${escapeHtml(train.time)}
                        </text>
                    `;
                }
            )
            .join("");

    const dots =
        values
            .map(
                (value, index) => {
                    const isBusiest =
                        index === busiestIndex;

                    return `
                        <circle
                            cx="${x(index)}"
                            cy="${y(value)}"
                            r="${isBusiest ? 8 : 5}"
                            fill="${isBusiest ? "#d9534f" : "#0078d7"}"
                        />

                        <text
                            x="${x(index)}"
                            y="${y(value) - 13}"
                            text-anchor="middle"
                            font-size="15"
                            font-weight="bold"
                            fill="#17212b"
                        >
                            ${value}
                        </text>
                    `;
                }
            )
            .join("");

    const averageY =
        y(average);

    const cancelledCount =
        trains.filter(train => train.cancelled).length;

    exportArea.innerHTML = `
        <div class="chart-export-card">

            <div class="chart-export-title">
                <h2>
                    Treintellingen Station Zandvoort
                </h2>

                <p>
                    Daggrafiek · personen per trein
                </p>
            </div>

            <svg
                width="${width}"
                height="${height}"
                viewBox="0 0 ${width} ${height}"
                xmlns="http://www.w3.org/2000/svg"
                role="img"
                aria-label="Daggrafiek van het aantal personen per trein"
            >

                <rect
                    width="100%"
                    height="100%"
                    fill="#ffffff"
                />

                ${gridLines}

                <line
                    x1="${margin.left}"
                    y1="${margin.top}"
                    x2="${margin.left}"
                    y2="${height - margin.bottom}"
                    stroke="#52606d"
                    stroke-width="2"
                />

                <line
                    x1="${margin.left}"
                    y1="${height - margin.bottom}"
                    x2="${width - margin.right}"
                    y2="${height - margin.bottom}"
                    stroke="#52606d"
                    stroke-width="2"
                />

                <line
                    x1="${margin.left}"
                    y1="${averageY}"
                    x2="${width - margin.right}"
                    y2="${averageY}"
                    stroke="#18864b"
                    stroke-width="3"
                    stroke-dasharray="10 8"
                />

                <text
                    x="${width - margin.right}"
                    y="${averageY - 10}"
                    text-anchor="end"
                    font-size="16"
                    fill="#18864b"
                >
                    Gemiddelde ${average.toFixed(1)}
                </text>

                <polyline
                    points="${points}"
                    fill="none"
                    stroke="#0078d7"
                    stroke-width="4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

                ${dots}
                ${labels}

                <text
                    x="22"
                    y="${margin.top + plotHeight / 2}"
                    text-anchor="middle"
                    font-size="18"
                    font-weight="bold"
                    fill="#17212b"
                    transform="rotate(-90 22 ${margin.top + plotHeight / 2})"
                >
                    Aantal personen
                </text>

                <text
                    x="${margin.left + plotWidth / 2}"
                    y="${height - 10}"
                    text-anchor="middle"
                    font-size="18"
                    font-weight="bold"
                    fill="#17212b"
                >
                    Treintijd
                </text>

            </svg>

            <div class="chart-summary">

                <div class="chart-summary-item">
                    <span>Totaal</span>
                    <strong>${total}</strong>
                </div>

                <div class="chart-summary-item">
                    <span>Gemiddelde</span>
                    <strong>${average.toFixed(1)}</strong>
                </div>

                <div class="chart-summary-item">
                    <span>Ingevulde treinen</span>
                    <strong>${filledTrains.length}</strong>
                </div>

                <div class="chart-summary-item">
                    <span>Geannuleerd</span>
                    <strong>${cancelledCount}</strong>
                </div>

                <div class="chart-summary-item">
                    <span>Hoogste telling</span>
                    <strong>${highest}</strong>
                </div>

                <div class="chart-summary-item">
                    <span>Laagste telling</span>
                    <strong>${lowest}</strong>
                </div>

                <div class="chart-summary-item">
                    <span>Drukste trein</span>
                    <strong>
                        ${escapeHtml(busiestTrain.time)}
                        ·
                        ${escapeHtml(busiestTrain.direction)}
                    </strong>
                </div>

            </div>
        </div>
    `;

    try {
        const canvas =
            await html2canvas(
                exportArea,
                {
                    width: 900,
                    height: 1200,
                    scale: 1,
                    backgroundColor: "#eef3f7",
                    useCORS: true,
                    logging: false
                }
            );

        const downloadLink =
            document.createElement("a");

        downloadLink.download =
            "treintellingen-daggrafiek.png";

        downloadLink.href =
            canvas.toDataURL("image/png");

        document.body
            .appendChild(downloadLink);

        downloadLink.click();

        downloadLink.remove();

    } catch (error) {
        console.error(
            "Daggrafiek maken mislukt:",
            error
        );

        alert(
            "Het maken van de daggrafiek is mislukt."
        );

    } finally {
        exportArea.innerHTML = "";
    }
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

document
    .getElementById("trainTime")
    .addEventListener(
        "keydown",
        event => {
            if (event.key === "Enter") {
                addTrain();
            }
        }
    );

let deferredInstallPrompt = null;

const installButton =
    document.getElementById(
        "installButton"
    );

window.addEventListener(
    "beforeinstallprompt",
    event => {
        event.preventDefault();

        deferredInstallPrompt =
            event;

        installButton.hidden =
            false;
    }
);

installButton.addEventListener(
    "click",
    async () => {
        if (!deferredInstallPrompt) {
            return;
        }

        deferredInstallPrompt.prompt();

        await deferredInstallPrompt
            .userChoice;

        deferredInstallPrompt =
            null;

        installButton.hidden =
            true;
    }
);

window.addEventListener(
    "appinstalled",
    () => {
        deferredInstallPrompt =
            null;

        installButton.hidden =
            true;
    }
);

if ("serviceWorker" in navigator) {
    window.addEventListener(
        "load",
        () => {
            navigator
                .serviceWorker
                .register(
                    "./service-worker.js"
                )
                .catch(
                    error => {
                        console.error(
                            "Service worker registreren mislukt:",
                            error
                        );
                    }
                );
        }
    );
}

loadData();
renderTrainGroups();
updateStatistics();
</script>
